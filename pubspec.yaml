name: hifive
description: hifive, a Flutter language learning app with replaceable local repositories.
publish_to: none
version: 1.0.0+2
environment:
  sdk: ^3.13.7
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  shared_preferences: ^2.5.6
  flutter_tts: ^4.2.5
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  flutter_email_sender: ^11.2.0
  sqlite3: ^3.9.0
  path_provider: ^2.1.6
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  google_sign_in: ^7.2.0
  http: ^1.6.0
  lottie: ^3.8.2
  intl: any
  youtube_player_iframe: ^6.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/lottie/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
